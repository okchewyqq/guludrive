name: release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.3
  GOWORK: 'off'
  CGO_ENABLED: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            ui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: MiSans faces
        run: bash scripts/fetch-fonts.sh

      # The embedded Web bundle is a gitignored build product, so it comes
      # first: the Go packages embed internal/webui/dist.
      - name: Web assets
        run: make web

      - name: Vet, test, Worker tests
        run: make check

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            ui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: MiSans faces
        run: bash scripts/fetch-fonts.sh

      - name: Web assets
        run: make web

      # One builder invocation, twelve concurrent Go builds.
      - name: Cross-compile
        run: make matrix

      - name: Package
        run: |
          cd dist
          sha256sum guludrive-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: guludrive-all
          path: |
            dist/guludrive-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/guludrive-* dist/SHA256SUMS
